syntax = "proto3";

package hoex.v1;

option go_package = "github.com/balesz/hoex/gen/hoex/v1;hoexv1";

// HostRunner runs allow-listed commands on the host on behalf of the sandbox.
service HostRunner {
  rpc Run(RunRequest) returns (stream RunEvent);
}

message RunRequest {
  repeated string argv = 1; // the command after --
  string cwd = 2;           // working directory of the sandbox side
}

message RunEvent {
  oneof event {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3; // last message of the stream
    string error = 4;    // e.g. rejected command
  }
}
